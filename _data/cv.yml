  summary: >
    Senior full-stack utvecklare med över 15 års erfarenhet av .NET / C# / Java
    och cloud-native lösningar. Har levererat projekt till Saab, Ericsson och KTH
    med fokus på nytta, skalbarhet, CI/CD och DevOps. Arbetar AI-drivet med GitHub
    Copilot och VS Code som primära verktyg, och bygger ut med MCP-servrar och
    externa tjänster efter behov. Undviker "vibe coding"-fällor genom spec-driven
    utveckling med SpecKit, omfattande testning och noggrann planering.

